[project]
name = "tiketa"
version = "0.1.0"
description = "A cinema booking assistant on LangGraph: free conversation, booking rules in code, confirmation before any booking"
requires-python = ">=3.12"
# The LLM stack is pinned exactly: litellm 1.82.7 and 1.82.8 were published with malware in March 2026,
# so a new version is taken on purpose, after it has been public for a while, never by a fresh install.
dependencies = [
    "litellm==1.106.4",
    "langchain-litellm==0.11.2",
    "langchain==1.4.7",
    "langgraph==1.2.17",
    "langgraph-checkpoint-postgres>=3.1",
    "langgraph-checkpoint-sqlite>=3.1",
    "fastapi>=0.160",
    "uvicorn[standard]>=0.50",
    "pydantic>=2.11",
    "pydantic-settings>=2.12",
    "sqlalchemy[asyncio]>=2.1",
    "alembic==1.20.1",
    "psycopg[binary,pool]>=3.3",
    "aiosqlite>=0.22",
    "redis>=8.0",
    "httpx>=0.28",
    "arize-phoenix-otel>=0.17",
    "openinference-instrumentation-langchain>=0.1.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
    "mypy>=2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
files = ["main.py", "app", "scripts"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["phoenix.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-local-folder = ["conftest", "fakes"]
