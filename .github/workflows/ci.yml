name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      # tests use a scripted model and SQLite: no API key, no services
      - run: pytest -q
      # known vulnerabilities in any dependency fail the build, except the reviewed ones in .pip-audit-ignore
      - run: pip-audit --skip-editable $(grep -v '^#' .pip-audit-ignore | sed 's/^/--ignore-vuln /')

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit, not only the last one
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tiketa:${{ github.sha }} .
